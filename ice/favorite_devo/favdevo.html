<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table> 
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>David A. Bednar</td>
            <td>The Character of Christ</td>
            <td>BYU-Idaho</td>
            <td>2003</td>
          </tr>
          <tr>
            <td>Jeffrey R. Holland</td>
            <td>Remember Lot's Wife</td>
            <td>BYU</td>
            <td>2009</td>
          </tr>
          <tr>
            <td>Dieter F. Uchtdorf</td>
            <td>Of Things That Matter Most</td>
            <td>General Conference</td>
            <td>2010</td>
          </tr>
        </table>
        <form>
          <label for="speaker">Speaker:</label>
          <input type="text" id="speaker"/>
          <label for="title">Title:</label>
          <input type="text" id="title"/>
          <label for="location">Location:</label>
          <input type="text" id="location"/>
          <label for="year">Year:</label>
          <input type="number" id="year"/>
          <button type="submit">Add Devotional</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
